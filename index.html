<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribo Estoque - Cloud v2.4</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, limit, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtW8DBXTvhDXlgVETRr5Rmai9-HGQ9eI0",
            authDomain: "estoque-tribo.firebaseapp.com",
            projectId: "estoque-tribo",
            storageBucket: "estoque-tribo.firebasestorage.app",
            messagingSenderId: "164742205462",
            appId: "1:164742205462:web:4d172f468955a14b5ae537",
            measurementId: "G-P9KJT31DLB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.fbSDK = { 
            db, auth, collection, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, limit, serverTimestamp, signInAnonymously 
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const [inventory, setInventory] = useState([]);
            const [history, setHistory] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [editingItem, setEditingItem] = useState(null);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);

            const [formData, setFormData] = useState({
                name: '', category: 'Padaria', quantity: 0, minStock: 5, unitPrice: 0,
                isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1
            });

            const [showNewCategoryInput, setShowNewCategoryInput] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');

            // Sincronização com Firebase
            useEffect(() => {
                const initSync = async () => {
                    if (!window.fbSDK) return;
                    const { db, auth, collection, onSnapshot, query, orderBy, limit, signInAnonymously } = window.fbSDK;
                    
                    try {
                        await signInAnonymously(auth);
                        
                        const qInv = query(collection(db, "inventory"));
                        const unsubInv = onSnapshot(qInv, (snapshot) => {
                            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setInventory(items);
                            setLoading(false);
                        });

                        const qHist = query(collection(db, "history"), orderBy("timestamp", "desc"), limit(100));
                        const unsubHist = onSnapshot(qHist, (snapshot) => {
                            const entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setHistory(entries);
                        });

                        return () => { unsubInv(); unsubHist(); };
                    } catch (err) {
                        console.error("Erro Firebase:", err);
                        setLoading(false);
                    }
                };

                const interval = setInterval(() => {
                    if (window.fbSDK) {
                        initSync();
                        clearInterval(interval);
                    }
                }, 500);
                return () => clearInterval(interval);
            }, []);

            // Cálculo Automático de Caixas
            useEffect(() => {
                if (formData.isBoxEntry) {
                    const price = parseFloat(formData.boxPrice) || 0;
                    const units = parseInt(formData.unitsPerBox) || 1;
                    const boxes = parseInt(formData.boxQuantity) || 1;
                    const calculatedUnit = units > 0 ? price / units : 0;
                    const totalUnits = boxes * units;
                    setFormData(prev => ({ 
                        ...prev, 
                        unitPrice: calculatedUnit, 
                        quantity: totalUnits 
                    }));
                }
            }, [formData.boxPrice, formData.unitsPerBox, formData.boxQuantity, formData.isBoxEntry]);

            const showToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const { db, collection, addDoc, updateDoc, doc, serverTimestamp } = window.fbSDK;
                
                const finalCategory = showNewCategoryInput ? newCategoryName : formData.category;
                const newQty = Number(formData.quantity);
                const newPrice = Number(formData.unitPrice);

                const existingItem = inventory.find(i => i.name.toLowerCase().trim() === formData.name.toLowerCase().trim());

                try {
                    let docId;
                    let actionType = editingItem ? 'Ajuste de Cadastro' : 'Nova Compra';

                    if (!editingItem && existingItem) {
                        const currentTotalValue = existingItem.quantity * existingItem.unitPrice;
                        const newEntryValue = newQty * newPrice;
                        const finalQty = existingItem.quantity + newQty;
                        const finalPrice = (currentTotalValue + newEntryValue) / finalQty;
                        
                        await updateDoc(doc(db, "inventory", existingItem.id), {
                            quantity: finalQty,
                            unitPrice: finalPrice,
                            lastUpdate: new Date().toISOString(),
                            category: finalCategory
                        });
                        docId = existingItem.id;
                        actionType = 'Compra (Média)';
                    } else if (editingItem) {
                        await updateDoc(doc(db, "inventory", editingItem.id), {
                            name: formData.name,
                            category: finalCategory,
                            quantity: newQty,
                            unitPrice: newPrice,
                            minStock: Number(formData.minStock),
                            lastUpdate: new Date().toISOString()
                        });
                        docId = editingItem.id;
                    } else {
                        const newDoc = await addDoc(collection(db, "inventory"), {
                            name: formData.name,
                            category: finalCategory,
                            quantity: newQty,
                            minStock: Number(formData.minStock),
                            unitPrice: newPrice,
                            lastUpdate: new Date().toISOString()
                        });
                        docId = newDoc.id;
                    }

                    if (!editingItem || (editingItem && formData.quantity !== editingItem.quantity)) {
                        const histDetails = formData.isBoxEntry 
                            ? `${formData.boxQuantity} cx de ${formData.unitsPerBox}un (R$ ${formData.boxPrice} p/ cx)`
                            : 'Lançamento manual de stock';

                        await addDoc(collection(db, "history"), {
                            productId: docId,
                            productName: formData.name,
                            type: actionType,
                            quantity: editingItem ? (newQty - editingItem.quantity) : newQty, 
                            unitPrice: newPrice,
                            timestamp: serverTimestamp(),
                            details: histDetails
                        });
                    }

                    showToast(editingItem ? "Dados atualizados!" : "Stock atualizado com sucesso!");
                    setIsModalOpen(false);
                    setShowNewCategoryInput(false);
                    setNewCategoryName('');
                } catch (err) { 
                    console.error(err);
                    showToast("Erro ao guardar dados", "error"); 
                }
            };

            const handleDelete = async (id) => {
                if (!confirm("Tem a certeza que deseja excluir este produto do catálogo?")) return;
                const { db, deleteDoc, doc } = window.fbSDK;
                try {
                    await deleteDoc(doc(db, "inventory", id));
                    showToast("Produto removido!");
                } catch (err) {
                    showToast("Erro ao remover", "error");
                }
            };

            const metrics = useMemo(() => {
                const totalValue = inventory.reduce((acc, item) => acc + (item.quantity * item.unitPrice), 0);
                const lowStockItems = inventory.filter(item => item.quantity <= item.minStock);
                const stagnantItems = inventory.filter(item => {
                    const lastDate = new Date(item.lastUpdate);
                    const diffDays = (Math.ceil(Math.abs(new Date() - lastDate) / (1000 * 60 * 60 * 24)));
                    return diffDays > 14;
                });
                return { totalValue, lowStockCount: lowStockItems.length, stagnantCount: stagnantItems.length };
            }, [inventory]);

            const existingCategories = useMemo(() => {
                const cats = new Set(inventory.map(i => i.category));
                return Array.from(cats).sort();
            }, [inventory]);

            const itemHistory = useMemo(() => {
                if (!formData.name) return [];
                return history.filter(h => h.productName.toLowerCase().includes(formData.name.toLowerCase())).slice(0, 3);
            }, [formData.name, history]);

            if (loading) return (
                <div className="flex h-screen items-center justify-center flex-col gap-4 bg-slate-50">
                    <div className="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                    <p className="font-bold text-emerald-800 animate-pulse text-xs uppercase tracking-widest text-center">A carregar dados da Tribo...</p>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    {notification && (
                        <div className={`fixed top-6 right-6 z-[100] px-6 py-4 rounded-2xl shadow-2xl text-white flex items-center gap-3 animate-bounce ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                            <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-triangle'} />
                            <span className="font-bold">{notification.message}</span>
                        </div>
                    )}

                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-2xl text-white shadow-lg"><Icon name="package" size={24} /></div>
                                <div>
                                    <h1 className="text-xl font-black text-slate-800 uppercase leading-none">Tribo Estoque</h1>
                                    <p className="text-[8px] font-black text-emerald-600 tracking-widest uppercase mt-1">Gestão de Inventário</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap justify-center gap-1 md:gap-2">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'dashboard' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Painel</button>
                                <button onClick={() => setActiveTab('inventory_list')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'inventory_list' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Estoque</button>
                                <button onClick={() => setActiveTab('products_mgmt')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'products_mgmt' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Produtos</button>
                                <button onClick={() => setActiveTab('history')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'history' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Histórico</button>
                                <button onClick={() => { 
                                    setEditingItem(null); 
                                    setFormData({name: '', category: existingCategories[0] || 'Padaria', quantity: 0, minStock: 5, unitPrice: 0, isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1}); 
                                    setIsModalOpen(true); 
                                }} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-emerald-100 active:scale-95 transition-all text-[10px] uppercase">+ Compra</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 mt-8">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Valor do Inventário</p>
                                        <p className="text-4xl font-black text-slate-800">R$ {metrics.totalValue.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Stock Baixo</p>
                                        <p className="text-4xl font-black text-amber-500">{metrics.lowStockCount}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Sem Giro (+14d)</p>
                                        <p className="text-4xl font-black text-rose-500">{metrics.stagnantCount}</p>
                                    </div>
                                </div>
                                
                                {metrics.lowStockCount > 0 && (
                                    <div className="bg-amber-50 border-2 border-amber-100 rounded-[2rem] p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-amber-500 text-white p-3 rounded-2xl animate-bounce"><Icon name="alert-circle" /></div>
                                            <div>
                                                <h4 className="font-black text-amber-900">Itens em Alerta</h4>
                                                <p className="text-amber-700 text-sm">{metrics.lowStockCount} produtos precisam de atenção imediata.</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setActiveTab('inventory_list')} className="w-full sm:w-auto bg-amber-500 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all">Ver Estoque</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'inventory_list' && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-3xl font-black text-slate-800">Visão por Família</h2>
                                    <div className="relative w-full md:w-80">
                                        <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                        <input type="text" placeholder="Filtrar produtos..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-white border border-slate-200 pl-12 pr-6 py-3 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 w-full font-bold shadow-sm" />
                                    </div>
                                </div>

                                {Array.from(new Set(inventory.map(i => i.category))).sort().map(cat => {
                                    const itemsInCat = inventory.filter(i => i.category === cat && i.name.toLowerCase().includes(searchTerm.toLowerCase()));
                                    if (itemsInCat.length === 0) return null;
                                    return (
                                        <div key={cat} className="space-y-4">
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-xs font-black uppercase tracking-widest text-slate-400">{cat}</h3>
                                                <div className="flex-1 h-px bg-slate-100"></div>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {itemsInCat.map(item => (
                                                    <div key={item.id} className={`bg-white p-6 rounded-[2rem] border transition-all relative ${item.quantity <= item.minStock ? 'border-amber-200 shadow-md' : 'border-slate-100 shadow-sm'}`}>
                                                        <div className="flex justify-between items-start mb-4">
                                                            <div>
                                                                <h4 className="font-black text-slate-800 text-lg leading-tight">{item.name}</h4>
                                                                <p className="text-[10px] font-bold text-slate-400 uppercase">{item.category}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex justify-between items-end">
                                                            <div>
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Disponível</p>
                                                                <div className={`text-3xl font-black ${item.quantity <= item.minStock ? 'text-rose-500' : 'text-slate-800'}`}>
                                                                    {item.quantity} <span className="text-xs opacity-40">un</span>
                                                                </div>
                                                            </div>
                                                            <div className="text-right">
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Custo Médio</p>
                                                                <p className="font-bold text-slate-600">R$ {Number(item.unitPrice).toFixed(2)}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {activeTab === 'products_mgmt' && (
                            <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden animate-in fade-in duration-500">
                                <div className="p-8 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
                                    <h2 className="text-2xl font-black text-slate-800">Cadastro de Itens</h2>
                                    <button onClick={() => { 
                                        setEditingItem(null); 
                                        setFormData({name: '', category: existingCategories[0] || 'Padaria', quantity: 0, minStock: 5, unitPrice: 0, isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1}); 
                                        setIsModalOpen(true); 
                                    }} className="text-xs font-black uppercase text-emerald-600 flex items-center gap-2 hover:bg-emerald-50 px-4 py-2 rounded-xl transition-all">
                                        <Icon name="plus" size={16} /> Novo Produto
                                    </button>
                                </div>
                                <div className="overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-left min-w-[800px]">
                                        <thead className="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                                            <tr>
                                                <th className="px-8 py-5">Produto</th>
                                                <th className="px-8 py-5">Família</th>
                                                <th className="px-8 py-5">Stock Mín.</th>
                                                <th className="px-8 py-5 text-right">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {inventory.sort((a,b) => a.name.localeCompare(b.name)).map(item => (
                                                <tr key={item.id} className="hover:bg-slate-50/50 transition-colors group">
                                                    <td className="px-8 py-5 font-black text-slate-700">{item.name}</td>
                                                    <td className="px-8 py-5 text-xs text-slate-500 font-bold uppercase">{item.category}</td>
                                                    <td className="px-8 py-5 text-xs text-slate-500 font-bold">{item.minStock} un</td>
                                                    <td className="px-8 py-5 text-right">
                                                        <div className="flex justify-end gap-3 opacity-30 group-hover:opacity-100 transition-all">
                                                            <button onClick={() => { setEditingItem(item); setFormData({...item, isBoxEntry: false}); setIsModalOpen(true); }} className="text-emerald-600 hover:bg-emerald-50 p-2 rounded-lg"><Icon name="edit" size={16} /></button>
                                                            <button onClick={() => handleDelete(item.id)} className="text-rose-500 hover:bg-rose-50 p-2 rounded-lg"><Icon name="trash-2" size={16} /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden animate-in fade-in duration-500">
                                <div className="p-8 border-b border-slate-50 flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-slate-800">Movimentações Cloud</h2>
                                    <Icon name="refresh-ccw" className="text-slate-300" size={18} />
                                </div>
                                <div className="overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-left min-w-[700px]">
                                        <thead className="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                                            <tr>
                                                <th className="px-8 py-5">Data/Hora</th>
                                                <th className="px-8 py-5">Produto</th>
                                                <th className="px-8 py-5">Tipo</th>
                                                <th className="px-8 py-5">Detalhes</th>
                                                <th className="px-8 py-5 text-right">Valor un.</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {history.map(h => (
                                                <tr key={h.id} className="hover:bg-slate-50/50">
                                                    <td className="px-8 py-5 text-slate-400 font-bold text-xs">
                                                        {h.timestamp?.toDate ? h.timestamp.toDate().toLocaleString('pt-BR') : 'A carregar...'}
                                                    </td>
                                                    <td className="px-8 py-5 font-black text-slate-700">{h.productName}</td>
                                                    <td className="px-8 py-5">
                                                        <span className={`px-2 py-1 rounded-lg text-[8px] font-black uppercase ${h.type.includes('Compra') ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                                                            {h.type}
                                                        </span>
                                                    </td>
                                                    <td className="px-8 py-5 text-slate-500 text-xs italic">{h.details}</td>
                                                    <td className="px-8 py-5 text-right font-black text-slate-800 text-xs">
                                                        R$ {Number(h.unitPrice).toFixed(2)}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl overflow-hidden animate-in zoom-in-95">
                                <div className="bg-emerald-600 p-6 md:p-8 flex justify-between items-center text-white">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black uppercase">{editingItem ? 'Editar Cadastro' : 'Lançar Compra'}</h3>
                                        <p className="text-emerald-200 text-[10px] font-bold uppercase tracking-widest mt-1">Sincronização Cloud Ativa</p>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white/20 p-2 rounded-xl hover:bg-white/30"><Icon name="x" size={20} /></button>
                                </div>
                                
                                <form onSubmit={handleSave} className="p-6 md:p-8 space-y-6 max-h-[75vh] overflow-y-auto custom-scrollbar">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-1.5 ml-1">Descrição</label>
                                            <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-emerald-500" placeholder="Nome do produto" />
                                            {!editingItem && itemHistory.length > 0 && (
                                                <div className="mt-2 bg-slate-100 p-3 rounded-xl border border-slate-200">
                                                    <p className="text-[8px] font-black uppercase text-slate-400 mb-1">Últimos preços registados:</p>
                                                    <div className="flex gap-2">
                                                        {itemHistory.map((h, i) => (
                                                            <span key={i} className="bg-white px-2 py-1 rounded text-[9px] font-bold border border-slate-200 text-slate-600">R$ {h.unitPrice.toFixed(2)}</span>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        
                                        {!editingItem && (
                                            <div className="flex bg-slate-100 p-1 rounded-2xl">
                                                <button type="button" onClick={() => setFormData({...formData, isBoxEntry: false})} className={`flex-1 py-2.5 text-[9px] font-black uppercase rounded-xl transition-all ${!formData.isBoxEntry ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-400'}`}>Simples</button>
                                                <button type="button" onClick={() => setFormData({...formData, isBoxEntry: true})} className={`flex-1 py-2.5 text-[9px] font-black uppercase rounded-xl transition-all ${formData.isBoxEntry ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-400'}`}>Por Caixa</button>
                                            </div>
                                        )}

                                        {formData.isBoxEntry ? (
                                            <div className="space-y-4 p-4 bg-emerald-50/50 rounded-2xl border border-emerald-100 animate-in slide-in-from-top-2">
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="text-[9px] font-black uppercase text-slate-400 ml-1">R$ Valor Caixa</label>
                                                        <input required type="number" step="0.01" value={formData.boxPrice} onChange={e => setFormData({...formData, boxPrice: e.target.value})} className="w-full px-5 py-3 bg-white rounded-xl font-bold border-2 border-transparent focus:border-emerald-500 shadow-sm" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[9px] font-black uppercase text-slate-400 ml-1">Un. por Caixa</label>
                                                        <input required type="number" value={formData.unitsPerBox} onChange={e => setFormData({...formData, unitsPerBox: e.target.value})} className="w-full px-5 py-3 bg-white rounded-xl font-bold border-2 border-transparent focus:border-emerald-500 shadow-sm" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[9px] font-black uppercase text-emerald-600 ml-1">Quantas Caixas?</label>
                                                    <input required type="number" value={formData.boxQuantity} onChange={e => setFormData({...formData, boxQuantity: e.target.value})} className="w-full px-5 py-3 bg-white border-2 border-emerald-200 rounded-xl font-black text-center text-3xl outline-none" />
                                                </div>
                                                <div className="bg-slate-900 rounded-2xl p-4 text-white flex justify-between items-center">
                                                    <div>
                                                        <p className="text-[8px] font-black uppercase text-emerald-400">Custo Un.</p>
                                                        <p className="text-xl font-black">R$ {formData.unitPrice.toFixed(2)}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-[8px] font-black uppercase text-emerald-400">Total Unidades</p>
                                                        <p className="text-xl font-black text-emerald-400">{formData.quantity}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Preço Unitário</label>
                                                    <input required type="number" step="0.01" value={formData.unitPrice} onChange={e => setFormData({...formData, unitPrice: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-emerald-500" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-1">{editingItem ? 'Qtd. Atual' : 'Adicionar Qtd.'}</label>
                                                    <input required type="number" value={formData.quantity} onChange={e => setFormData({...formData, quantity: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-emerald-500" />
                                                </div>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Stock Mínimo</label>
                                                <input required type="number" value={formData.minStock} onChange={e => setFormData({...formData, minStock: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-rose-300" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Família</label>
                                                {!showNewCategoryInput ? (
                                                    <select 
                                                        value={formData.category} 
                                                        onChange={e => e.target.value === 'NEW' ? setShowNewCategoryInput(true) : setFormData({...formData, category: e.target.value})} 
                                                        className="w-full px-4 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-emerald-500"
                                                    >
                                                        {existingCategories.length === 0 && <option value="Padaria">Padaria</option>}
                                                        {existingCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                        <option value="NEW" className="text-emerald-600 font-bold">+ Nova Família...</option>
                                                    </select>
                                                ) : (
                                                    <div className="relative">
                                                        <input autoFocus type="text" placeholder="Nova Família" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} className="w-full px-5 py-3 bg-emerald-50 border-2 border-emerald-200 rounded-2xl font-bold outline-none" />
                                                        <button type="button" onClick={() => setShowNewCategoryInput(false)} className="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] font-black text-rose-500 uppercase">X</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-emerald-100 hover:bg-emerald-700 active:scale-[0.98] transition-all text-[10px] uppercase tracking-widest mt-4">Guardar e Sincronizar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

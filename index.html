<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribo Estoque - Cloud v2.7</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, limit, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtW8DBXTvhDXlgVETRr5Rmai9-HGQ9eI0",
            authDomain: "estoque-tribo.firebaseapp.com",
            projectId: "estoque-tribo",
            storageBucket: "estoque-tribo.firebasestorage.app",
            messagingSenderId: "164742205462",
            appId: "1:164742205462:web:4d172f468955a14b5ae537",
            measurementId: "G-P9KJT31DLB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.fbSDK = { 
            db, auth, collection, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, limit, serverTimestamp, signInAnonymously 
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const [rawInventory, setRawInventory] = useState([]);
            const [history, setHistory] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isExitModalOpen, setIsExitModalOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [editingItem, setEditingItem] = useState(null);
            const [exitItem, setExitItem] = useState(null);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);

            const [formData, setFormData] = useState({
                name: '', category: 'Padaria', quantity: 0, minStock: 5, unitPrice: 0,
                isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1
            });

            const [exitQty, setExitQty] = useState(1);

            const [showNewCategoryInput, setShowNewCategoryInput] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');

            // Consolidação inteligente de Itens com o mesmo nome
            const inventory = useMemo(() => {
                const consolidated = {};
                rawInventory.forEach(item => {
                    const normalizedName = item.name.toLowerCase().trim();
                    if (!consolidated[normalizedName]) {
                        consolidated[normalizedName] = { ...item, ids: [item.id], originalItems: [item] };
                    } else {
                        const existing = consolidated[normalizedName];
                        const totalQty = existing.quantity + item.quantity;
                        const avgPrice = totalQty > 0 
                            ? (existing.quantity * existing.unitPrice + item.quantity * item.unitPrice) / totalQty 
                            : 0;
                        
                        consolidated[normalizedName] = {
                            ...existing,
                            ids: [...existing.ids, item.id],
                            originalItems: [...existing.originalItems, item],
                            quantity: totalQty,
                            unitPrice: avgPrice,
                            minStock: Math.max(existing.minStock, item.minStock),
                            lastUpdate: new Date(existing.lastUpdate) > new Date(item.lastUpdate) ? existing.lastUpdate : item.lastUpdate
                        };
                    }
                });
                return Object.values(consolidated);
            }, [rawInventory]);

            // Sincronização com Firebase
            useEffect(() => {
                const initSync = async () => {
                    if (!window.fbSDK) return;
                    const { db, auth, collection, onSnapshot, query, orderBy, limit, signInAnonymously } = window.fbSDK;
                    
                    try {
                        await signInAnonymously(auth);
                        
                        const qInv = query(collection(db, "inventory"));
                        const unsubInv = onSnapshot(qInv, (snapshot) => {
                            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setRawInventory(items);
                            setLoading(false);
                        });

                        const qHist = query(collection(db, "history"), orderBy("timestamp", "desc"), limit(100));
                        const unsubHist = onSnapshot(qHist, (snapshot) => {
                            const entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setHistory(entries);
                        });

                        return () => { unsubInv(); unsubHist(); };
                    } catch (err) {
                        console.error("Erro Firebase:", err);
                        setLoading(false);
                    }
                };

                const interval = setInterval(() => {
                    if (window.fbSDK) {
                        initSync();
                        clearInterval(interval);
                    }
                }, 500);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (formData.isBoxEntry) {
                    const price = parseFloat(formData.boxPrice) || 0;
                    const units = parseInt(formData.unitsPerBox) || 1;
                    const boxes = parseInt(formData.boxQuantity) || 1;
                    const calculatedUnit = units > 0 ? price / units : 0;
                    const totalUnits = boxes * units;
                    setFormData(prev => ({ ...prev, unitPrice: calculatedUnit, quantity: totalUnits }));
                }
            }, [formData.boxPrice, formData.unitsPerBox, formData.boxQuantity, formData.isBoxEntry]);

            const showToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const { db, collection, addDoc, updateDoc, doc, serverTimestamp } = window.fbSDK;
                const finalCategory = showNewCategoryInput ? newCategoryName : formData.category;
                const newQty = Number(formData.quantity);
                const newPrice = Number(formData.unitPrice);
                const normalizedInputName = formData.name.toLowerCase().trim();
                const existingItem = rawInventory.find(i => i.name.toLowerCase().trim() === normalizedInputName);

                try {
                    let docId;
                    let actionType = editingItem ? 'Ajuste' : 'Nova Compra';

                    if (!editingItem && existingItem) {
                        const currentTotalValue = existingItem.quantity * existingItem.unitPrice;
                        const newEntryValue = newQty * newPrice;
                        const finalQty = existingItem.quantity + newQty;
                        const finalPrice = (currentTotalValue + newEntryValue) / finalQty;
                        
                        await updateDoc(doc(db, "inventory", existingItem.id), {
                            quantity: finalQty,
                            unitPrice: finalPrice,
                            lastUpdate: new Date().toISOString(),
                            category: finalCategory
                        });
                        docId = existingItem.id;
                        actionType = 'Compra (Média)';
                    } else if (editingItem) {
                        await updateDoc(doc(db, "inventory", editingItem.id), {
                            name: formData.name,
                            category: finalCategory,
                            quantity: newQty,
                            unitPrice: newPrice,
                            minStock: Number(formData.minStock),
                            lastUpdate: new Date().toISOString()
                        });
                        docId = editingItem.id;
                    } else {
                        const newDoc = await addDoc(collection(db, "inventory"), {
                            name: formData.name,
                            category: finalCategory,
                            quantity: newQty,
                            minStock: Number(formData.minStock),
                            unitPrice: newPrice,
                            lastUpdate: new Date().toISOString()
                        });
                        docId = newDoc.id;
                    }

                    const histDetails = formData.isBoxEntry 
                        ? `${formData.boxQuantity} cx de ${formData.unitsPerBox}un (R$ ${formData.boxPrice} p/ cx)`
                        : 'Lançamento manual';

                    await addDoc(collection(db, "history"), {
                        productId: docId,
                        productName: formData.name,
                        type: actionType,
                        quantity: editingItem ? (newQty - editingItem.quantity) : newQty, 
                        unitPrice: newPrice,
                        timestamp: serverTimestamp(),
                        details: histDetails
                    });

                    showToast("Sucesso ao salvar!");
                    setIsModalOpen(false);
                    setShowNewCategoryInput(false);
                    setNewCategoryName('');
                } catch (err) { 
                    showToast("Erro ao guardar dados", "error"); 
                }
            };

            const handleExitSave = async (e) => {
                e.preventDefault();
                if (!exitItem || Number(exitQty) <= 0) return;
                const { db, updateDoc, doc, addDoc, serverTimestamp } = window.fbSDK;
                
                // Pega todos os registros originais que compõem este item consolidado
                const relatedItems = rawInventory.filter(i => i.name.toLowerCase().trim() === exitItem.name.toLowerCase().trim());
                let remainingToExit = Number(exitQty);
                const totalAvailable = relatedItems.reduce((acc, curr) => acc + curr.quantity, 0);

                if (remainingToExit > totalAvailable) {
                    showToast("Quantidade maior que o estoque total!", "error");
                    return;
                }

                try {
                    // Algoritmo para abater das quantidades disponíveis em cada documento (FIFO simplificado)
                    for (const item of relatedItems) {
                        if (remainingToExit <= 0) break;
                        
                        let subtraction = Math.min(item.quantity, remainingToExit);
                        let newQty = item.quantity - subtraction;
                        remainingToExit -= subtraction;

                        await updateDoc(doc(db, "inventory", item.id), {
                            quantity: newQty,
                            lastUpdate: new Date().toISOString()
                        });
                    }

                    await addDoc(collection(db, "history"), {
                        productId: exitItem.id, // Referência do primeiro item
                        productName: exitItem.name,
                        type: 'Saída (Baixa)',
                        quantity: -Number(exitQty),
                        unitPrice: exitItem.unitPrice,
                        timestamp: serverTimestamp(),
                        details: `Saída consolidada de ${exitQty} unidades`
                    });

                    showToast("Saída registrada com sucesso!");
                    setIsExitModalOpen(false);
                    setExitQty(1);
                } catch (err) {
                    console.error(err);
                    showToast("Erro ao processar a saída", "error");
                }
            };

            const handleDelete = async (item) => {
                if (!confirm(`Deseja remover "${item.name}" e TODOS os seus registros vinculados?`)) return;
                const { db, deleteDoc, doc } = window.fbSDK;
                try {
                    const relatedItems = rawInventory.filter(i => i.name.toLowerCase().trim() === item.name.toLowerCase().trim());
                    for (const ri of relatedItems) {
                        await deleteDoc(doc(db, "inventory", ri.id));
                    }
                    showToast("Item e registros vinculados removidos!");
                } catch (err) {
                    showToast("Erro ao remover", "error");
                }
            };

            const metrics = useMemo(() => {
                const totalValue = inventory.reduce((acc, item) => acc + (item.quantity * item.unitPrice), 0);
                const lowStockItems = inventory.filter(item => item.quantity <= item.minStock);
                const stagnantItems = inventory.filter(item => {
                    const lastDate = new Date(item.lastUpdate);
                    const diffDays = (Math.ceil(Math.abs(new Date() - lastDate) / (1000 * 60 * 60 * 24)));
                    return diffDays > 14;
                });
                return { totalValue, lowStockCount: lowStockItems.length, stagnantCount: stagnantItems.length };
            }, [inventory]);

            const existingCategories = useMemo(() => {
                const cats = new Set(inventory.map(i => i.category));
                return Array.from(cats).sort();
            }, [inventory]);

            const itemHistory = useMemo(() => {
                if (!formData.name) return [];
                const search = formData.name.toLowerCase().trim();
                return history.filter(h => h.productName.toLowerCase().includes(search)).slice(0, 3);
            }, [formData.name, history]);

            if (loading) return (
                <div className="flex h-screen items-center justify-center flex-col gap-4 bg-slate-50">
                    <div className="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                    <p className="font-bold text-emerald-800 animate-pulse text-xs uppercase tracking-widest text-center">Tribo Estoque: Consolidando Dados...</p>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    {notification && (
                        <div className={`fixed top-6 right-6 z-[100] px-6 py-4 rounded-2xl shadow-2xl text-white flex items-center gap-3 animate-bounce ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                            <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-triangle'} />
                            <span className="font-bold">{notification.message}</span>
                        </div>
                    )}

                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-2xl text-white shadow-lg"><Icon name="package" size={24} /></div>
                                <div>
                                    <h1 className="text-xl font-black text-slate-800 uppercase leading-none">Tribo Estoque</h1>
                                    <p className="text-[8px] font-black text-emerald-600 tracking-widest uppercase mt-1">Gestão de Inventário Cloud</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap justify-center gap-1 md:gap-2">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'dashboard' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Painel</button>
                                <button onClick={() => setActiveTab('inventory_list')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'inventory_list' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Estoque</button>
                                <button onClick={() => setActiveTab('products_mgmt')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'products_mgmt' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Produtos</button>
                                <button onClick={() => setActiveTab('history')} className={`px-3 md:px-4 py-2 rounded-xl font-bold text-xs transition-all ${activeTab === 'history' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Histórico</button>
                                <button onClick={() => { 
                                    setEditingItem(null); 
                                    setFormData({name: '', category: existingCategories[0] || 'Padaria', quantity: 0, minStock: 5, unitPrice: 0, isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1}); 
                                    setIsModalOpen(true); 
                                }} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-emerald-100 active:scale-95 transition-all text-[10px] uppercase">+ Compra</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 mt-8">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-emerald-300 transition-all">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Patrimônio (Preço Médio)</p>
                                        <p className="text-4xl font-black text-slate-800">R$ {metrics.totalValue.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-amber-300 transition-all">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Produtos em Alerta</p>
                                        <p className="text-4xl font-black text-amber-500">{metrics.lowStockCount}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-rose-300 transition-all">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Sem Movimento (+14d)</p>
                                        <p className="text-4xl font-black text-rose-500">{metrics.stagnantCount}</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventory_list' && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-3xl font-black text-slate-800">Visão Geral</h2>
                                    <div className="relative w-full md:w-80">
                                        <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                        <input type="text" placeholder="Pesquisar estoque..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-white border border-slate-200 pl-12 pr-6 py-3 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 w-full font-bold shadow-sm" />
                                    </div>
                                </div>

                                {existingCategories.map(cat => {
                                    const itemsInCat = inventory.filter(i => i.category === cat && i.name.toLowerCase().includes(searchTerm.toLowerCase()));
                                    if (itemsInCat.length === 0) return null;
                                    return (
                                        <div key={cat} className="space-y-4">
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-xs font-black uppercase tracking-widest text-slate-400">{cat}</h3>
                                                <div className="flex-1 h-px bg-slate-100"></div>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {itemsInCat.map(item => (
                                                    <div key={item.name} className={`bg-white p-6 rounded-[2rem] border transition-all relative ${item.quantity <= item.minStock ? 'border-amber-200 shadow-md ring-1 ring-amber-100' : 'border-slate-100 shadow-sm hover:shadow-md'}`}>
                                                        <div className="mb-4">
                                                            <h4 className="font-black text-slate-800 text-lg leading-tight truncate">{item.name}</h4>
                                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{item.category}</p>
                                                        </div>
                                                        <div className="flex justify-between items-end mb-6">
                                                            <div>
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Consolidado</p>
                                                                <div className={`text-3xl font-black ${item.quantity <= item.minStock ? 'text-rose-500' : 'text-slate-800'}`}>
                                                                    {item.quantity} <span className="text-xs opacity-40 uppercase">un</span>
                                                                </div>
                                                            </div>
                                                            <div className="text-right">
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Preço Médio</p>
                                                                <p className="font-bold text-slate-600 font-mono">R$ {Number(item.unitPrice).toFixed(2)}</p>
                                                            </div>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-50">
                                                            <button 
                                                                onClick={() => {
                                                                    setEditingItem(null); 
                                                                    setFormData({
                                                                        ...formData,
                                                                        name: item.name,
                                                                        category: item.category,
                                                                        minStock: item.minStock,
                                                                        unitPrice: item.unitPrice,
                                                                        isBoxEntry: false
                                                                    }); 
                                                                    setIsModalOpen(true); 
                                                                }}
                                                                className="flex items-center justify-center gap-2 bg-emerald-50 text-emerald-600 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-emerald-100 transition-colors"
                                                            >
                                                                <Icon name="plus-circle" size={14} /> Entrada
                                                            </button>
                                                            <button 
                                                                onClick={() => {
                                                                    setExitItem(item);
                                                                    setIsExitModalOpen(true);
                                                                }}
                                                                className="flex items-center justify-center gap-2 bg-rose-50 text-rose-600 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-rose-100 transition-colors"
                                                            >
                                                                <Icon name="minus-circle" size={14} /> Saída
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {activeTab === 'products_mgmt' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-3xl font-black text-slate-800">Gerenciar Catálogo</h2>
                                    <div className="relative w-full md:w-80">
                                        <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                        <input type="text" placeholder="Filtrar produtos..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-white border border-slate-200 pl-12 pr-6 py-3 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 w-full font-bold shadow-sm" />
                                    </div>
                                </div>

                                {existingCategories.map(cat => {
                                    const itemsInCat = inventory.filter(item => item.category === cat && item.name.toLowerCase().includes(searchTerm.toLowerCase()));
                                    if (itemsInCat.length === 0) return null;
                                    
                                    return (
                                        <div key={cat} className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden mb-6">
                                            <div className="px-8 py-5 bg-slate-50/50 border-b border-slate-100 flex justify-between items-center">
                                                <h3 className="text-sm font-black uppercase tracking-widest text-slate-400">{cat}</h3>
                                                <div className="bg-white px-3 py-1 rounded-full border border-slate-200 text-[9px] font-black text-slate-400">{itemsInCat.length} ITENS</div>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left min-w-[600px]">
                                                    <thead className="text-[9px] font-black uppercase text-slate-300 border-b border-slate-50">
                                                        <tr>
                                                            <th className="px-8 py-4">Nome do Produto</th>
                                                            <th className="px-8 py-4 text-center">Stock Total</th>
                                                            <th className="px-8 py-4 text-center">Preço Médio</th>
                                                            <th className="px-8 py-4 text-right">Ações</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-50">
                                                        {itemsInCat.sort((a,b) => a.name.localeCompare(b.name)).map(item => (
                                                            <tr key={item.name} className="hover:bg-slate-50/30 transition-colors group">
                                                                <td className="px-8 py-4 font-black text-slate-700">{item.name}</td>
                                                                <td className="px-8 py-4 text-center text-xs font-bold text-slate-500">{item.quantity} un</td>
                                                                <td className="px-8 py-4 text-center text-xs font-black text-emerald-600">R$ {item.unitPrice.toFixed(2)}</td>
                                                                <td className="px-8 py-4 text-right">
                                                                    <div className="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                                                        <button onClick={() => { setEditingItem(item); setFormData({...item, isBoxEntry: false}); setIsModalOpen(true); }} className="text-emerald-500 hover:bg-emerald-50 p-2 rounded-xl transition-all"><Icon name="edit" size={16} /></button>
                                                                        <button onClick={() => handleDelete(item)} className="text-rose-400 hover:bg-rose-50 p-2 rounded-xl transition-all"><Icon name="trash-2" size={16} /></button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden animate-in fade-in duration-500">
                                <div className="p-8 border-b border-slate-50 flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-slate-800">Log de Movimentações</h2>
                                    <Icon name="activity" className="text-slate-300" size={18} />
                                </div>
                                <div className="overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-left min-w-[700px]">
                                        <thead className="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                                            <tr>
                                                <th className="px-8 py-5">Data/Hora</th>
                                                <th className="px-8 py-5">Produto</th>
                                                <th className="px-8 py-5">Movimento</th>
                                                <th className="px-8 py-5">Descrição</th>
                                                <th className="px-8 py-5 text-right">Alteração</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {history.map(h => (
                                                <tr key={h.id} className="hover:bg-slate-50/50 transition-colors text-xs">
                                                    <td className="px-8 py-5 text-slate-400 font-bold">
                                                        {h.timestamp?.toDate ? h.timestamp.toDate().toLocaleString('pt-BR') : 'Agora'}
                                                    </td>
                                                    <td className="px-8 py-5 font-black text-slate-700 uppercase">{h.productName}</td>
                                                    <td className="px-8 py-5">
                                                        <span className={`px-2 py-1 rounded-lg text-[8px] font-black uppercase ${
                                                            h.type.includes('Saída') ? 'bg-rose-100 text-rose-700' : 
                                                            h.type.includes('Compra') ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'
                                                        }`}>
                                                            {h.type}
                                                        </span>
                                                    </td>
                                                    <td className="px-8 py-5 text-slate-500 italic">{h.details}</td>
                                                    <td className={`px-8 py-5 text-right font-black ${h.quantity < 0 ? 'text-rose-500' : 'text-emerald-600'}`}>
                                                        {h.quantity > 0 ? `+${h.quantity}` : h.quantity} un
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DE ENTRADA */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-in fade-in">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl overflow-hidden animate-in zoom-in-95">
                                <div className="bg-emerald-600 p-6 md:p-8 flex justify-between items-center text-white">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black uppercase tracking-tight">{editingItem ? 'Editar Cadastro' : 'Entrada de Estoque'}</h3>
                                        <p className="text-emerald-200 text-[10px] font-bold uppercase tracking-widest mt-1">Cálculo de Média Ativo</p>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white/20 p-2 rounded-xl hover:bg-white/30 transition-all"><Icon name="x" size={20} /></button>
                                </div>
                                <form onSubmit={handleSave} className="p-6 md:p-8 space-y-6 max-h-[75vh] overflow-y-auto custom-scrollbar text-sm">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-1.5 ml-1">Descrição</label>
                                            <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-emerald-500" placeholder="Ex: Hambúrguer 100G" />
                                        </div>
                                        {!editingItem && (
                                            <div className="flex bg-slate-100 p-1 rounded-2xl">
                                                <button type="button" onClick={() => setFormData({...formData, isBoxEntry: false})} className={`flex-1 py-2.5 text-[9px] font-black uppercase rounded-xl transition-all ${!formData.isBoxEntry ? 'bg-white shadow-md text-emerald-600' : 'text-slate-400'}`}>Unitário</button>
                                                <button type="button" onClick={() => setFormData({...formData, isBoxEntry: true})} className={`flex-1 py-2.5 text-[9px] font-black uppercase rounded-xl transition-all ${formData.isBoxEntry ? 'bg-white shadow-md text-emerald-600' : 'text-slate-400'}`}>Caixa</button>
                                            </div>
                                        )}
                                        {formData.isBoxEntry ? (
                                            <div className="space-y-4 p-5 bg-emerald-50 rounded-[2rem] border border-emerald-100 animate-in slide-in-from-top-2">
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="text-[9px] font-black uppercase text-slate-400 ml-1">R$ Valor Caixa</label>
                                                        <input required type="number" step="0.01" value={formData.boxPrice} onChange={e => setFormData({...formData, boxPrice: e.target.value})} className="w-full px-4 py-2 rounded-xl font-bold border-none" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[9px] font-black uppercase text-slate-400 ml-1">Un. p/ Caixa</label>
                                                        <input required type="number" value={formData.unitsPerBox} onChange={e => setFormData({...formData, unitsPerBox: e.target.value})} className="w-full px-4 py-2 rounded-xl font-bold border-none" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[9px] font-black uppercase text-emerald-600 ml-1 text-center block">Total de Caixas Compradas</label>
                                                    <input required type="number" value={formData.boxQuantity} onChange={e => setFormData({...formData, boxQuantity: e.target.value})} className="w-full py-3 rounded-xl font-black text-center text-3xl border-2 border-emerald-200 outline-none" />
                                                </div>
                                                <div className="bg-slate-900 rounded-2xl p-4 text-white flex justify-between items-center">
                                                    <div className="text-center flex-1 border-r border-slate-700">
                                                        <p className="text-[8px] font-black uppercase text-emerald-400">Custo Un.</p>
                                                        <p className="text-xl font-black">R$ {formData.unitPrice.toFixed(2)}</p>
                                                    </div>
                                                    <div className="text-center flex-1">
                                                        <p className="text-[8px] font-black uppercase text-emerald-400">Total Unidades</p>
                                                        <p className="text-xl font-black text-emerald-400">{formData.quantity}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Preço Unitário</label>
                                                    <input required type="number" step="0.01" value={formData.unitPrice} onChange={e => setFormData({...formData, unitPrice: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-emerald-500" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-1">{editingItem ? 'Stock Físico' : 'Qtd. Entrada'}</label>
                                                    <input required type="number" value={formData.quantity} onChange={e => setFormData({...formData, quantity: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-emerald-500" />
                                                </div>
                                            </div>
                                        )}
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Alerta Mínimo</label>
                                                <input required type="number" value={formData.minStock} onChange={e => setFormData({...formData, minStock: e.target.value})} className="w-full px-5 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-rose-400" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Família</label>
                                                {!showNewCategoryInput ? (
                                                    <select value={formData.category} onChange={e => e.target.value === 'NEW' ? setShowNewCategoryInput(true) : setFormData({...formData, category: e.target.value})} className="w-full px-4 py-3 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-emerald-500 appearance-none">
                                                        {existingCategories.length === 0 && <option value="Padaria">Padaria</option>}
                                                        {existingCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                        <option value="NEW" className="text-emerald-600 font-black">+ Novo Setor...</option>
                                                    </select>
                                                ) : (
                                                    <div className="relative">
                                                        <input autoFocus type="text" placeholder="Nome do Setor" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} className="w-full px-5 py-3 bg-emerald-50 border-2 border-emerald-300 rounded-2xl font-bold outline-none" />
                                                        <button type="button" onClick={() => setShowNewCategoryInput(false)} className="absolute right-3 top-1/2 -translate-y-1/2 text-rose-500 p-2"><Icon name="x" size={14} /></button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-black py-5 rounded-[2rem] shadow-2xl hover:bg-emerald-700 active:scale-[0.97] transition-all uppercase tracking-widest mt-4">Confirmar e Guardar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE SAÍDA */}
                    {isExitModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-in fade-in">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95">
                                <div className="bg-rose-600 p-6 flex justify-between items-center text-white">
                                    <div>
                                        <h3 className="text-lg font-black uppercase tracking-tight">Baixa Consolidada</h3>
                                        <p className="text-rose-200 text-[9px] font-bold uppercase tracking-widest">{exitItem?.name}</p>
                                    </div>
                                    <button onClick={() => setIsExitModalOpen(false)} className="bg-white/20 p-2 rounded-xl hover:bg-white/30 transition-all"><Icon name="x" size={20} /></button>
                                </div>
                                <form onSubmit={handleExitSave} className="p-8 space-y-6">
                                    <div className="text-center">
                                        <p className="text-[10px] font-black uppercase text-slate-400 mb-6">Stock Unificado Atual: <span className="text-slate-800">{exitItem?.quantity} un</span></p>
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-3">Quantidade a retirar</label>
                                        <div className="flex items-center justify-center gap-6">
                                            <button type="button" onClick={() => setExitQty(Math.max(1, exitQty - 1))} className="bg-slate-100 w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:bg-slate-200 transition-colors"><Icon name="minus" /></button>
                                            <input required type="number" min="1" value={exitQty} onChange={e => setExitQty(e.target.value)} className="w-24 text-center text-5xl font-black outline-none border-b-4 border-rose-500 pb-2 text-slate-800" />
                                            <button type="button" onClick={() => setExitQty(Number(exitQty) + 1)} className="bg-slate-100 w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400 hover:bg-slate-200 transition-colors"><Icon name="plus" /></button>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl text-center">
                                        <p className="text-[9px] font-bold text-slate-400 uppercase italic">Stock Resultante: <span className="text-slate-800 font-black">{exitItem?.quantity - exitQty} un</span></p>
                                    </div>
                                    <button type="submit" className="w-full bg-rose-600 text-white font-black py-5 rounded-[2rem] shadow-2xl hover:bg-rose-700 active:scale-[0.97] transition-all uppercase tracking-widest">Confirmar Baixa</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

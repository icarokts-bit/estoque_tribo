<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribo Estoque - Cloud v2.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, limit, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtW8DBXTvhDXlgVETRr5Rmai9-HGQ9eI0",
            authDomain: "estoque-tribo.firebaseapp.com",
            projectId: "estoque-tribo",
            storageBucket: "estoque-tribo.firebasestorage.app",
            messagingSenderId: "164742205462",
            appId: "1:164742205462:web:4d172f468955a14b5ae537",
            measurementId: "G-P9KJT31DLB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.fbSDK = { 
            db, auth, collection, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, limit, serverTimestamp, signInAnonymously 
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const [inventory, setInventory] = useState([]);
            const [history, setHistory] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [editingItem, setEditingItem] = useState(null);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);

            const [formData, setFormData] = useState({
                name: '', category: 'Padaria', quantity: 0, minStock: 5, unitPrice: 0,
                isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1,
                whatsappContact: '55'
            });

            useEffect(() => {
                const initSync = async () => {
                    if (!window.fbSDK) return;
                    const { db, auth, onSnapshot, collection, query, orderBy, limit, signInAnonymously } = window.fbSDK;
                    try {
                        await signInAnonymously(auth);
                        onSnapshot(query(collection(db, "inventory")), (snapshot) => {
                            setInventory(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                            setLoading(false);
                        });
                        onSnapshot(query(collection(db, "history"), orderBy("timestamp", "desc"), limit(50)), (snapshot) => {
                            setHistory(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                        });
                    } catch (error) { console.error("Erro na sincronização:", error); }
                };
                const checkSDK = setInterval(() => {
                    if (window.fbSDK?.signInAnonymously) { initSync(); clearInterval(checkSDK); }
                }, 500);
                return () => clearInterval(checkSDK);
            }, []);

            useEffect(() => {
                if (formData.isBoxEntry) {
                    const price = parseFloat(formData.boxPrice) || 0;
                    const units = parseInt(formData.unitsPerBox) || 1;
                    const boxes = parseInt(formData.boxQuantity) || 1;
                    const calculatedUnit = units > 0 ? price / units : 0;
                    const totalUnits = boxes * units;
                    setFormData(prev => ({ ...prev, unitPrice: calculatedUnit, quantity: totalUnits }));
                }
            }, [formData.boxPrice, formData.unitsPerBox, formData.boxQuantity, formData.isBoxEntry]);

            const showToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const { db, collection, addDoc, updateDoc, doc, serverTimestamp } = window.fbSDK;
                const data = {
                    name: formData.name,
                    category: formData.category,
                    quantity: Number(formData.quantity),
                    minStock: Number(formData.minStock),
                    unitPrice: Number(formData.unitPrice),
                    whatsappContact: formData.whatsappContact,
                    lastUpdate: new Date().toISOString(),
                    updatedAt: serverTimestamp()
                };

                try {
                    let docId;
                    if (editingItem) {
                        await updateDoc(doc(db, "inventory", editingItem.id), data);
                        docId = editingItem.id;
                    } else {
                        const newDoc = await addDoc(collection(db, "inventory"), data);
                        docId = newDoc.id;
                    }

                    const histDetails = formData.isBoxEntry 
                        ? `${formData.boxQuantity} cx de ${formData.unitsPerBox}un (R$ ${formData.boxPrice} cada)`
                        : 'Entrada unitária';

                    await addDoc(collection(db, "history"), {
                        productId: docId,
                        productName: data.name,
                        type: editingItem ? 'Ajuste' : 'Nova Compra',
                        quantity: data.quantity,
                        unitPrice: data.unitPrice,
                        timestamp: serverTimestamp(),
                        details: histDetails
                    });

                    showToast(editingItem ? "Atualizado!" : "Lançamento Sucesso!");
                    setIsModalOpen(false);
                } catch (err) { showToast("Erro ao salvar", "error"); }
            };

            const metrics = useMemo(() => {
                const totalValue = inventory.reduce((acc, item) => acc + (item.quantity * item.unitPrice), 0);
                const lowStockItems = inventory.filter(item => item.quantity <= item.minStock);
                const stagnantItems = inventory.filter(item => {
                    const lastDate = new Date(item.lastUpdate);
                    return (Math.ceil(Math.abs(new Date() - lastDate) / (1000 * 60 * 60 * 24))) > 14;
                });
                return { totalValue, lowStockCount: lowStockItems.length, stagnantCount: stagnantItems.length, lowStockItems, stagnantItems };
            }, [inventory]);

            if (loading) return (
                <div className="flex h-screen items-center justify-center flex-col gap-4">
                    <div className="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                    <p className="font-bold text-emerald-800 animate-pulse text-xs uppercase tracking-widest">Tribo Cloud...</p>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    {notification && (
                        <div className={`fixed top-6 right-6 z-[100] px-6 py-4 rounded-2xl shadow-2xl text-white flex items-center gap-3 animate-bounce ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                            <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-triangle'} />
                            <span className="font-bold">{notification.message}</span>
                        </div>
                    )}

                    {}
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-2xl text-white shadow-lg"><Icon name="package" size={24} /></div>
                                <div className="hidden sm:block">
                                    <h1 className="text-xl font-black text-slate-800 uppercase">Tribo Estoque</h1>
                                    <p className="text-[8px] font-black text-emerald-600 tracking-widest uppercase">Sistema Cloud v2</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-xl font-bold transition-all ${activeTab === 'dashboard' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Painel</button>
                                <button onClick={() => setActiveTab('inventory_list')} className={`px-4 py-2 rounded-xl font-bold transition-all ${activeTab === 'inventory_list' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Estoque</button>
                                <button onClick={() => setActiveTab('history')} className={`px-4 py-2 rounded-xl font-bold transition-all ${activeTab === 'history' ? 'bg-slate-100 text-emerald-600' : 'text-slate-400'}`}>Histórico</button>
                                <button onClick={() => { setEditingItem(null); setFormData({name: '', category: 'Padaria', quantity: 0, minStock: 5, unitPrice: 0, isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1, whatsappContact: '55'}); setIsModalOpen(true); }} className="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-emerald-100 active:scale-95 transition-all">+ Comprar</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 mt-8">
                        {}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Patrimônio em Estoque</p>
                                        <p className="text-4xl font-black text-slate-800">R$ {metrics.totalValue.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Itens p/ Reposição</p>
                                        <p className="text-4xl font-black text-amber-500">{metrics.lowStockCount}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                        <p className="text-slate-400 text-[10px] font-black uppercase mb-1">Sem Giro (+14d)</p>
                                        <p className="text-4xl font-black text-rose-500">{metrics.stagnantCount}</p>
                                    </div>
                                </div>
                                
                                {metrics.lowStockCount > 0 && (
                                    <div className="bg-amber-50 border-2 border-amber-100 rounded-[2rem] p-6 flex items-center justify-between">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-amber-500 text-white p-3 rounded-2xl"><Icon name="alert-circle" /></div>
                                            <div>
                                                <h4 className="font-black text-amber-900">Atenção na Reposição</h4>
                                                <p className="text-amber-700 text-sm">Existem itens abaixo do estoque mínimo configurado.</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setActiveTab('inventory_list')} className="bg-amber-500 text-white px-6 py-2 rounded-xl font-bold text-sm">Ver Agora</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {}
                        {activeTab === 'inventory_list' && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-3xl font-black text-slate-800">Estoque por Família</h2>
                                    <div className="relative w-full md:w-80">
                                        <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={18} />
                                        <input type="text" placeholder="Buscar no estoque..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-white border border-slate-200 pl-12 pr-6 py-3 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 w-full font-bold" />
                                    </div>
                                </div>

                                {Array.from(new Set(inventory.map(i => i.category))).sort().map(cat => {
                                    const itemsInCat = inventory.filter(i => i.category === cat && i.name.toLowerCase().includes(searchTerm.toLowerCase()));
                                    if (itemsInCat.length === 0) return null;
                                    return (
                                        <div key={cat} className="space-y-4">
                                            <div className="flex items-center gap-3 ml-2">
                                                <div className="h-2 w-2 bg-emerald-500 rounded-full"></div>
                                                <h3 className="text-sm font-black uppercase tracking-[0.2em] text-slate-400">{cat}</h3>
                                                <div className="flex-1 h-px bg-slate-100"></div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {itemsInCat.map(item => (
                                                    <div key={item.id} className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-md transition-all group relative">
                                                        <div className="flex justify-between items-start mb-4">
                                                            <div>
                                                                <h4 className="font-black text-slate-800 text-lg leading-tight">{item.name}</h4>
                                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{item.category}</p>
                                                            </div>
                                                            <button onClick={() => { setEditingItem(item); setFormData({ ...item, isBoxEntry: false, boxPrice: 0, unitsPerBox: 1, boxQuantity: 1 }); setIsModalOpen(true); }} className="text-slate-300 hover:text-emerald-600 transition-colors">
                                                                <Icon name="edit-3" size={18} />
                                                            </button>
                                                        </div>
                                                        <div className="flex justify-between items-end">
                                                            <div>
                                                                <p className="text-[9px] font-black uppercase text-slate-400 mb-1">Qtd Atual</p>
                                                                <div className={`text-2xl font-black ${item.quantity <= item.minStock ? 'text-rose-500' : 'text-slate-700'}`}>
                                                                    {item.quantity} <span className="text-xs opacity-50">un.</span>
                                                                </div>
                                                            </div>
                                                            <div className="text-right">
                                                                <p className="text-[9px] font-black uppercase text-slate-400 mb-1">Valor Un.</p>
                                                                <p className="font-bold text-slate-600">R$ {item.unitPrice.toFixed(2)}</p>
                                                            </div>
                                                        </div>
                                                        {item.quantity <= item.minStock && (
                                                            <div className="absolute top-4 right-4 bg-rose-100 text-rose-600 p-2 rounded-xl animate-pulse">
                                                                <Icon name="alert-triangle" size={14} />
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {}
                        {activeTab === 'history' && (
                            <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden animate-in fade-in duration-500">
                                <div className="p-8 border-b border-slate-50 flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-slate-800">Últimos Lançamentos</h2>
                                    <Icon name="history" className="text-slate-300" />
                                </div>
                                <div className="divide-y divide-slate-50 overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 text-[10px] font-black uppercase text-slate-400 tracking-widest">
                                            <tr>
                                                <th className="px-8 py-4">Data</th>
                                                <th className="px-8 py-4">Produto</th>
                                                <th className="px-8 py-4">Tipo</th>
                                                <th className="px-8 py-4">Detalhes</th>
                                                <th className="px-8 py-4 text-right">Valor Lançado</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50 text-sm">
                                            {history.map(h => (
                                                <tr key={h.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-8 py-5 text-slate-400 font-bold whitespace-nowrap">
                                                        {h.timestamp?.toDate ? h.timestamp.toDate().toLocaleDateString('pt-BR') : 'Recent'}
                                                    </td>
                                                    <td className="px-8 py-5 font-black text-slate-700">{h.productName}</td>
                                                    <td className="px-8 py-5">
                                                        <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${h.type === 'Ajuste' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}`}>
                                                            {h.type}
                                                        </span>
                                                    </td>
                                                    <td className="px-8 py-5 text-slate-500 text-xs italic">{h.details}</td>
                                                    <td className="px-8 py-5 text-right font-black text-slate-800">
                                                        R$ {(h.quantity * h.unitPrice).toFixed(2)}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-xl overflow-hidden animate-in zoom-in-95">
                                <div className="bg-emerald-600 p-8 flex justify-between items-center text-white">
                                    <h3 className="text-2xl font-black">{editingItem ? 'Editar Produto' : 'Novo Lançamento'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white/20 p-2 rounded-2xl hover:bg-white/30 transition-colors">
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>
                                
                                <form onSubmit={handleSave} className="p-8 space-y-6 max-h-[75vh] overflow-y-auto custom-scrollbar">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Nome do Produto</label>
                                            <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-emerald-500" placeholder="Ex: Pão de Hambúrguer" />
                                        </div>
                                        
                                        <div className="flex bg-slate-100 p-1 rounded-2xl">
                                            <button type="button" onClick={() => setFormData({...formData, isBoxEntry: false})} className={`flex-1 py-3 text-[10px] font-black uppercase rounded-xl transition-all ${!formData.isBoxEntry ? 'bg-white shadow text-emerald-600' : 'text-slate-400'}`}>Unitário</button>
                                            <button type="button" onClick={() => setFormData({...formData, isBoxEntry: true})} className={`flex-1 py-3 text-[10px] font-black uppercase rounded-xl transition-all ${formData.isBoxEntry ? 'bg-white shadow text-emerald-600' : 'text-slate-400'}`}>Por Caixa</button>
                                        </div>

                                        {formData.isBoxEntry ? (
                                            <div className="space-y-4 animate-in slide-in-from-top-2">
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="space-y-1">
                                                        <label className="text-[10px] font-black uppercase text-slate-400">Valor Caixa</label>
                                                        <input required type="number" step="0.01" value={formData.boxPrice} onChange={e => setFormData({...formData, boxPrice: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold" />
                                                    </div>
                                                    <div className="space-y-1">
                                                        <label className="text-[10px] font-black uppercase text-slate-400">Itens/Cx</label>
                                                        <input required type="number" value={formData.unitsPerBox} onChange={e => setFormData({...formData, unitsPerBox: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold" />
                                                    </div>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-black uppercase text-emerald-600">Qtd de Caixas</label>
                                                    <input required type="number" value={formData.boxQuantity} onChange={e => setFormData({...formData, boxQuantity: e.target.value})} className="w-full px-6 py-4 bg-emerald-50 border-2 border-emerald-100 rounded-2xl font-black text-center text-2xl outline-none" />
                                                </div>
                                                <div className="bg-slate-900 rounded-[2rem] p-6 text-white flex justify-between items-center shadow-xl">
                                                    <div>
                                                        <p className="text-[8px] font-black uppercase text-emerald-400">Custo Unit.</p>
                                                        <p className="text-2xl font-black">R$ {formData.unitPrice.toFixed(2)}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-[8px] font-black uppercase text-emerald-400">Total Unidades</p>
                                                        <p className="text-2xl font-black text-emerald-400">{formData.quantity}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Preço Unitário</label>
                                                    <input required type="number" step="0.01" value={formData.unitPrice} onChange={e => setFormData({...formData, unitPrice: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Qtd Atual</label>
                                                    <input required type="number" value={formData.quantity} onChange={e => setFormData({...formData, quantity: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold" />
                                                </div>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-4 pt-2">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Mín. Alerta</label>
                                                <input required type="number" value={formData.minStock} onChange={e => setFormData({...formData, minStock: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Família</label>
                                                <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold outline-none">
                                                    <option value="Padaria">Padaria</option>
                                                    <option value="Frios">Frios</option>
                                                    <option value="Bebidas">Bebidas</option>
                                                    <option value="Limpeza">Limpeza</option>
                                                    <option value="Secos">Secos</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-black py-5 rounded-[2rem] shadow-xl hover:bg-emerald-700 active:scale-95 transition-all text-sm uppercase tracking-widest">Confirmar Lançamento Cloud</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
